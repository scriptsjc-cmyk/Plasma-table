<!-- Make a part: the drawing bar, tools and shape library. Loaded into the shell at start-up. -->
<template data-slot="make-bar">
<div id="makeBar" class="makebar">
    <h1>Make a part</h1>
    <div id="qbPinned" class="qb-pinned" role="group" aria-label="Edit the drawing"></div>
    <div id="makeSelectWrap" class="head-dd hidden">
      <button type="button" id="btnSelectMenu" class="small" aria-expanded="false" aria-haspopup="true" aria-controls="makeSelectPop">Select</button>
      <div id="makeSelectPop" class="head-pop hidden" hidden role="menu"></div>
    </div>
    <div id="makeSnapWrap" class="head-dd hidden">
      <button type="button" id="btnSnapMenu" class="small" aria-expanded="false" aria-haspopup="true" aria-controls="makeSnapPop">Snap</button>
      <div id="makeSnapPop" class="head-pop hidden" hidden role="menu"></div>
    </div>
    <button type="button" id="btnSimpleSnap" class="switch simplesnap" role="switch" aria-checked="false" title="Snap: shapes click neatly to the grid, edges and centres so they line up exactly"><span class="switch-track" aria-hidden="true"></span><span class="switch-label">Snap</span></button>
    <button type="button" id="btnDragPan" class="switch dragpan" role="switch" aria-checked="false" title="Drag selects: drag a box on empty canvas to pick every part it covers. Click to switch to pan. Space never pans — Space is STOP."><span class="switch-track" aria-hidden="true"></span><span class="switch-label">Drag selects</span></button>
    <button type="button" id="btnMakeImport" class="small makeimp" title="Open a DXF or SVG drawing and add its parts to this sheet">Open DXF / SVG</button>
    <input type="file" id="makeImpFiles" accept=".dxf,.svg" multiple hidden>
    <span class="makeexp-wrap">
      <button type="button" id="btnMakeExport" class="small makeexp" title="Save the current drawing as DXF or SVG (the design, not the cut path)">Export DXF / SVG</button>
      <div id="makeExportPop" class="exportpop hidden" hidden role="dialog" aria-labelledby="makeExportTitle">
        <p id="makeExportTitle" class="exportpop-title">Save the drawing</p>
        <p class="muted small has-info"><span class="info-label">This is the design geometry.</span><button type="button" class="info-i" data-tip="This is the design geometry, not the kerfed toolpath. Arcs stay as arcs." aria-label="More about the exported drawing"></button><span class="info-body"> not the kerfed toolpath. Arcs stay as arcs.</span></p>
        <div class="row wrap exportpop-actions">
          <button type="button" id="makeExpCancel">Cancel</button>
          <button type="button" id="makeExpDxf" class="accent">DXF (R12)</button>
          <button type="button" id="makeExpSvg">SVG</button>
        </div>
      </div>
    </span>
    <button type="button" id="btnMakeCheckCut" class="small makecheck" title="Check whether this drawing will cut cleanly" aria-label="Check cut">Check cut</button>
    <button type="button" id="btnViewParts" class="small viewparts">Parts</button>
    <div id="editorSwitch" class="editorsw" role="group" aria-label="Drawing tools">
      <button type="button" id="btnAdvancedTools" class="modesw-btn">Advanced tools</button>
      <button type="button" id="btnSimpleView" class="modesw-btn hidden">Simple view</button>
      <button type="button" id="btnPresetParts" class="modesw-btn">Preset parts</button>
    </div>
  </div>
</template>

<template data-slot="make-editor">
<div id="srcShape" class="hidden" data-insp="part">
          <div class="insp-tabs" role="tablist" aria-label="Part inspector">
            <button type="button" role="tab" data-insp="part" aria-selected="true" class="on">Part</button>
            <button type="button" role="tab" data-insp="size" aria-selected="false">Size</button>
            <button type="button" role="tab" data-insp="holes" aria-selected="false">Features</button>
            <button type="button" role="tab" data-insp="arrange" aria-selected="false">Arrange</button>

          <div class="sktools">
            <button id="skUndo" title="Undo (Ctrl+Z)">↶ Undo</button><button id="skRedo" title="Redo (Ctrl+Y)">↷ Redo</button>
            <button id="skAll" title="Pick every shape (Ctrl+A)">▣ Pick all</button><button id="skFit" title="Show everything (double-click empty space)">⤢ Fit</button>
            <button id="skClear" title="Remove every shape">Clear</button>
          </div>
          <div class="skopts">
            <label>Snap to <select id="skSnap"><option value="0">off</option><option value="0.1">0.1 mm</option><option value="0.5">0.5 mm</option><option value="1">1 mm</option><option value="5">5 mm</option><option value="10">10 mm</option></select></label>
            <label class="check"><input type="checkbox" id="skGuides"> Line-up guides</label>
          </div>
          <div id="edgePanel" class="edgepanel hidden insp-part" hidden>
            <div class="edgehead">
              <h3>Edit edge</h3>
              <div class="row">
                <button type="button" id="edgeCancel" class="small">Cancel</button>
                <button type="button" id="edgeDone" class="small go">Done</button>
              </div>
            </div>

              <label>Length (mm)

                  <button type="button" id="edgeLenApply" class="small">Set</button>
                </span>
              </label>
              <label>Keep this end fixed
                <select id="edgeFixed"><option value="start">Start</option><option value="end">End</option></select>
              </label>
            </div>
            <div class="row wrap">
              <button type="button" id="edgeSquare" class="small">Square up (0/90°)</button>
              <button type="button" id="edgeSquarePrev" class="small">Square to previous</button>
            </div>
            <div class="grid2">
              <label>Angle (°)
                <span class="row" style="margin-top:0">
                  <input id="edgeAng" type="number" step="0.1" inputmode="decimal">
                  <button type="button" id="edgeAngApply" class="small">Set</button>
                </span>
              </label>
              <label>Measured from
                <select id="edgeAngMode"><option value="abs">Absolute</option><option value="rel">Previous edge</option></select>
              </label>
            </div>
            <div class="grid2">
              <label>Curve radius (mm)

                  <input id="edgeRad" type="number" min="0" step="0.1" inputmode="decimal">
                  <button type="button" id="edgeCurve" class="small">Curve</button>
                </span>
              </label>
              <label>Bulge

                  <input id="edgeBulge" type="number" step="0.05" inputmode="decimal">
                  <button type="button" id="edgeStraight" class="small">Straight</button>
                </span>
              </label>
            </div>
            <div class="row wrap">
              <button type="button" id="edgeAddV" class="small">Add corner in the middle</button>
              <button type="button" id="edgeDelV" class="small warn">Delete corner</button>
            </div>
          </div>
          <div id="filletPanel" class="edgepanel hidden insp-part" hidden>
            <h3 id="filletTitle">Fillet corners</h3>
            <p class="muted small" id="filletHint">Click a corner to give it a radius. Inside (re-entrant) corners get a smooth inner radius; outside corners are rounded off. Hover a corner to preview the radius.</p>
            <label id="filletKindLab">Kind
              <select id="filletMode">
                <option value="round">Round corner</option>
                <option value="relief">Relief cut (circle into corner)</option>
              </select>
            </label>
            <div class="row wrap">
              <label id="filletSizeLab">Radius (mm)
                <input id="filletRad" type="number" min="0.1" step="0.1" inputmode="decimal" value="5">
              </label>
              <label id="filletAngLab" class="hidden" hidden>Angle (degrees)
                <input id="filletAng" type="number" min="1" max="89" step="0.1" inputmode="decimal" value="45">
              </label>
              <button type="button" id="filletAllInside" class="small">All inside corners</button>
              <button type="button" id="filletDone" class="small">Done</button>
            </div>
          </div>
          <div id="proTools" class="protools hidden insp-arrange"></div>
          <h3 class="addtiles insp-part">Add a part</h3>
          <div id="shapeTiles" class="tiles small addtiles insp-part"></div>
          <div id="featPanel" class="featpanel insp-holes">
            <div class="feathead"><h3>Features</h3><button type="button" id="featAdd" class="small" aria-haspopup="menu" aria-expanded="false" aria-controls="featAddMenu" title="Add a hole, slot, pattern, cut-out, text or etch line to the picked part">+ Add</button></div>
            <div id="featAddMenu" class="featmenu hidden" role="menu" aria-label="Add a feature"></div>
            <p class="feat-adopt small" hidden><span></span> <button type="button" id="featAdopt" class="small">Put them into this part</button></p>
            <p class="muted small feat-empty">Pick a part to see and add its features.</p>
            <ul id="featList" class="featlist" aria-label="Features of the picked part"></ul>
            <div id="featRowMenu" class="featmenu feat-menu hidden" role="menu" aria-label="Feature actions">
              <button type="button" role="menuitem" data-fact="dup">Duplicate <kbd>Ctrl+D</kbd></button>
              <button type="button" role="menuitem" data-fact="mirror">Mirror (linked)</button>
              <button type="button" role="menuitem" data-fact="unlink">Unlink</button>
              <button type="button" role="menuitem" data-fact="pattern">Pattern</button>
              <button type="button" role="menuitem" data-fact="move">Move…</button>
              <button type="button" role="menuitem" data-fact="del" class="danger">Delete <kbd>Del</kbd></button>
            </div>
          </div>
          <h3 class="addtiles insp-holes">Add holes <span class="muted small has-info"><span class="info-label">(pick a part first)</span><button type="button" class="info-i" data-tip="Pick a part first and the holes land in its middle." aria-label="More about adding holes"></button><span class="info-body"> and they land in its middle</span></span></h3>
          <div id="holeTiles" class="tiles small addtiles insp-holes"></div>
          <div id="shapeForm" class="shapeform insp-size"></div>
          <details id="sheetSizeBox" class="sheetsize insp-size">
            <summary>Drawing sheet</summary>
            <div class="grid2">
              <label>Width <input id="sheetSizeW" type="number" min="50" max="20000" step="any" inputmode="decimal"> mm</label>
              <label>Height <input id="sheetSizeH" type="number" min="50" max="20000" step="any" inputmode="decimal"> mm</label>
            </div>
            <p class="muted small has-info insp-size"><span class="info-label">All sizes are in mm, finished size.</span><button type="button" class="info-i" data-tip="All sizes in mm and are the finished part – the cut width is allowed for automatically." aria-label="More about sizes and cut width"></button><span class="info-body"> All sizes in mm and are the finished part – the cut width is allowed for automatically.</span></p>
          </details>
          <section id="layersPanel" class="layerspanel insp-part" aria-label="Parts list">
            <div class="layershead">
              <h3>Parts</h3>
              <button type="button" id="layersClose" class="small" aria-label="Close the parts list">✕</button>
            </div>
            <ul id="layersList" class="layerslist"></ul>
          </section>
          <section id="cutSummary" class="cutsummary insp-size" aria-label="Cut settings"></section>
          <div id="cutCheck" class="cutcheck insp-size"></div>
          <details class="guide"><summary>What this machine can cut</summary><div class="limitsBody"></div></details>
          <details class="guide howto beginner-help">
            <summary>How to use the shape maker</summary>
            <ul>
              <li><b>Add</b> – use the bar under the drawing for a rectangle, circle or triangle, or tap <b>More</b> for the full shape library. Tap a hole with a part picked and it drops into the middle of it.</li>
              <li><b>Rotate your phone</b> – landscape gives you a bigger drawing, with the tools down the side. Portrait still works as before.</li>
              <li><b>Move</b> – drag it. Guide lines appear when it lines up with another shape. Hold <b>Alt</b> to move freely.</li>
              <li><b>Size</b> – tap the millimetre label above or beside the shape and type the exact size (you can use 100/2 or 50+12.5). Or drag a corner, or use the boxes below.</li>
              <li><b>Versions</b> – tap a shape, then pick a version (rounded, chamfered, corner holes, flange, gusset…). It keeps the size and place.</li>
              <li><b>Advanced tools</b> – opens the full drawing editor: a dense layout, arrays, subtract, offset and every tool in one place. Simple view takes you back to the templates.</li>
              <li><b>Edit a drawn outline</b> – after <b>Draw outline</b>, click an edge to type an exact length, square it up, set an angle, or turn it into a curve (drag the midpoint handle). Drag corners, double-click an edge to add a corner, Delete removes one. Undo still works.</li>
              <li><b>Holes</b> – drag a hole to move it. The numbers show how far its middle is from the part's left and bottom edges.</li>
              <li><b>Several at once</b> – Shift-click them, or drag a box round them on empty space. Then move, copy, turn, mirror or delete them together.</li>
              <li><b>Join</b> – pick shapes that touch or overlap and press <b>Join into one part</b>. They become one outline, with all their holes. Now copy it, resize it or turn it as one part.</li>
              <li><b>Line up</b> – with several picked, the Line-up buttons move them to match the biggest one (e.g. pick a plate and a hole, press <b>Dead centre</b>).</li>
              <li><b>Copy</b> – Copy button, or Ctrl+C then Ctrl+V. For lots of the same thing use <b>How many</b> below.</li>
              <li><b>Keys</b> – arrows nudge 1 mm (Shift 10, Alt 0.1), L line, R rectangle, C circle, D measure, M select, S snap on/off, F fit, H/V mirror left-right or up-down, Delete removes, Ctrl+Z undo, Ctrl+Y redo, Ctrl+J join. Keys are ignored while you type in a box.</li>
              <li><b>View</b> – on a laptop the wheel zooms to the cursor, the middle button pans and right-click opens a menu. On a phone, scroll still pans; pinch to zoom. Space is STOP (it never pans). Double-click empty space, or press F, to fit.</li>
            </ul>
          </details>
          <h3 class="insp-arrange">How many of the whole drawing?</h3>
          <div class="grid3 insp-arrange">
            <label>Across<input id="cpX" type="number" min="1" value="1" inputmode="numeric"></label>
            <label>Up<input id="cpY" type="number" min="1" value="1" inputmode="numeric"></label>
            <label>Gap (mm)<input id="cpGap" type="number" min="0" value="10" inputmode="decimal"></label>
          </div>
          
        </div>
</template>

<template data-slot="make-files">
<!-- import DXF / SVG files -->
<div id="importDlg" class="shapelib acctdlg impdlg hidden" role="dialog" aria-modal="true" aria-labelledby="impTitle">
  <div class="shapelib-card">
    <div class="shapelib-head"><h2 id="impTitle">Import DXF / SVG</h2><button type="button" id="impCancel">Cancel</button></div>
    <p class="muted small impintro">Pick up to 20 DXF or SVG drawings. Each one is saved as a part (named after the file) in the folder below. A file that can't be read is skipped and the rest still import. Only closed outlines can be cut: loose lines that don't join up into a shape are reported next to the file.</p>
    <div class="impmeta">
      <label>Folder <input id="impFolder" list="impFolderList" maxlength="60" autocomplete="off"></label>
      <datalist id="impFolderList"></datalist>
      <label id="impDrop" class="drop impdrop"><input id="impFiles" type="file" accept=".dxf,.svg" multiple><b>Choose DXF or SVG files</b><span class="muted">or drop them here (up to 20)</span></label>
    </div>
    <p id="impNote" class="muted small"></p>
    <div id="impAll" class="row hidden unitall"><span class="small">Size check for all files:</span>
      <button type="button" class="small" data-all="1">All are mm</button><button type="button" class="small" data-all="25.4">All were inches (× 25.4)</button><button type="button" class="small" data-all="0.03937">All ÷ 25.4</button></div>
    <div id="impList" class="implist"></div>
    <progress id="impBar" class="hidden" value="0" max="1"></progress>
    <p id="impSummary" class="hidden okchip"></p>
    <div class="row"><button type="button" id="impGo" class="xl go grow" disabled>Import</button></div>
  </div>
</div>

<!-- resize a part -->
<div id="resizeDlg" class="numpad hidden" role="dialog" aria-modal="true" aria-labelledby="resizeTitle">
  <div class="numpad-card sizecard">
    <h3 id="resizeTitle">Exact width and height</h3>
    <p id="resizeNow" class="muted small"></p>
    <div class="grid2">
      <label>Width (mm)<input id="rsW" type="number" min="2" step="any" inputmode="decimal"></label>
      <label>Height (mm)<input id="rsH" type="number" min="2" step="any" inputmode="decimal"></label>
    </div>
    <label class="check"><input type="checkbox" id="rsKeep" checked> Keep proportions</label>
    <p class="muted small">Untick it to stretch the part. A stretched arc keeps its sweep angle, so a circle turns into a rounded curve, not a true circle.</p>
    <div class="row"><button type="button" id="rsCancel" class="xl grow">Cancel</button><button type="button" id="rsOk" class="xl go grow">Resize</button></div>
  </div>
</div>

<!-- set a part size -->
<div id="sizeDlg" class="numpad hidden" role="dialog" aria-modal="true" aria-labelledby="sizeTitle">
  <div class="numpad-card sizecard">
    <h3 id="sizeTitle">Check the size</h3>
    <p id="sizeText" class="sizetext"></p>
    <p id="sizeUnits" class="muted small"></p>
    <label id="sizeAllRow" class="check small hidden"><input type="checkbox" id="sizeAll"> <span id="sizeAllText">Same answer for the other files</span></label>
    <div class="col">
      <button type="button" id="sizeYes" class="xl go">Yes, that's right</button>
      <button type="button" id="sizeInch" class="xl">It was inches (× 25.4)</button>
      <button type="button" id="sizeMm" class="xl">It was mm, shown as inches (÷ 25.4)</button>
      <div class="row sizescale">
        <label class="grow">Scale so it is
          <span class="row" style="margin-top:0"><input id="sizeTo" type="number" min="1" step="any" inputmode="decimal" placeholder="mm"><select id="sizeAxis" aria-label="Wide or tall"><option value="w">mm wide</option><option value="h">mm tall</option></select></span>
        </label>
        <button type="button" id="sizeScale" class="small">Scale to this</button>
      </div>
    </div>
  </div>
</div>
<!-- import: ask what to do with the file -->
<div id="importAskDlg" class="numpad hidden" role="dialog" aria-modal="true" aria-labelledby="importAskTitle">
  <div class="numpad-card">
    <h3 id="importAskTitle">Add to the sheet, or replace?</h3>
    <p id="importAskText" class="muted small">You already have a drawing open.</p>
    <div class="col">
      <button type="button" id="importAskAdd" class="xl go">Add to the sheet</button>
      <button type="button" id="importAskReplace" class="xl">Replace what is open</button>
      <button type="button" id="importAskCancel" class="small">Cancel</button>
    </div>
  </div>
</div>
<!-- straighten a wobbly line -->
<div id="straightDlg" class="numpad hidden" role="dialog" aria-modal="true" aria-labelledby="straightTitle">
  <div class="numpad-card">
    <h3 id="straightTitle">Straight cut</h3>
    <p class="muted small">Cut one straight line, no drawing needed. Pick the direction and length, then set the start point in the next steps (jog the torch there and press Start here).</p>
    <div class="grid2">
      <label>Direction
        <select id="stDir"><option value="x">Along X (left to right)</option><option value="y">Along Y (front to back)</option></select>
      </label>
      <label>Length (mm)<input id="stLen" type="number" min="1" step="any" inputmode="decimal" value="300"></label>
      <label>Start X (mm, optional)<input id="stX" type="number" step="any" inputmode="decimal" placeholder="Auto (use torch spot)"></label>
      <label>Start Y (mm, optional)<input id="stY" type="number" step="any" inputmode="decimal" placeholder="Auto (use torch spot)"></label>
    </div>
    <p class="muted small" id="stNote">Typed start: measured from the machine's home corner. It needs the machine homed and moves nothing, it only sets the start point.</p>
    <div class="numpad-row"><button type="button" id="stCancel">Cancel</button><button type="button" id="stOk" class="go">Make the cut</button></div>
  </div>
</div>
</template>
