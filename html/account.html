<!-- Account, sign-in gate, saving and admin dialogs. Loaded into the shell at start-up. -->
<template data-slot="account-main">
<!-- ============================================================ account / gating dialogs -->
<div id="accountDlg" class="acctdlg shapelib hidden" role="dialog" aria-modal="true" aria-labelledby="acctTitle">
  <div class="shapelib-card slim acctcard">
    <div class="loginbrand">
      <img src="logo.svg" alt="" class="loginmark">
      <h1 class="sr-only">Porta Plazma CNC</h1>
    </div>
    <div class="shapelib-head">
      <h2 id="acctTitle">Account</h2>
      <button type="button" class="acct-close">Close</button>
    </div>
    <div id="acctBody">

      <div data-pane="in">
        <p class="muted" id="acctDemoTag2">Sign in or create an account. Running a real table also needs a linked machine.</p>
        <form id="formSignIn" class="col">
          <label>Email<input id="inEmail" type="email" autocomplete="username" required></label>
          <label>Password<span class="pwfield"><input id="inPin" type="password" autocomplete="current-password" required minlength="6"><button type="button" class="pwshow" data-pw="inPin" aria-pressed="false" aria-label="Show password">Show</button></span></label>
          <button type="submit" class="xl go">Sign in</button>
        </form>
        <div class="row">
          <button type="button" id="goSignUp" class="small">Create an account</button>
          <button type="button" id="goLink" class="small">Email me a sign-in link</button>
          <button type="button" id="goReset" class="small">Reset password</button>
        </div>
      </div>

      <div data-pane="up" class="hidden">
        <h3>Create an account</h3>
        <form id="formSignUp" class="col">
          <label>Name<input id="upName" type="text" autocomplete="name" maxlength="80"></label>
          <label>Email<input id="upEmail" type="email" autocomplete="username" required></label>
          <label>Password<span class="pwfield"><input id="upPin" type="password" autocomplete="new-password" required minlength="6"><button type="button" class="pwshow" data-pw="upPin" aria-pressed="false" aria-label="Show password">Show</button></span></label>
          <p class="muted small">At least 6 characters. You can change this later.</p>
          <div class="signup-submit">
            <button type="submit" class="xl go">Create account</button>
          </div>
        </form>
        <button type="button" id="goSignIn" class="small">Already have an account? Sign in</button>
      </div>

      <div data-pane="confirm" class="hidden">
        <h3>Check your email</h3>
        <p>We sent a confirmation link to <b id="confirmEmail"></b>. Open it, then come back here and sign in. The link is needed because email confirmation is on for this project.</p>
        <div class="row">
          <button type="button" id="btnResendConfirm">Resend the email</button>
          <button type="button" id="confirmGoIn" class="go">I have confirmed — sign in</button>
        </div>
      </div>

      <div data-pane="link" class="hidden">
        <h3>Email a sign-in link</h3>
        <form id="formLink" class="col">
          <label>Email<input id="linkEmail" type="email" autocomplete="username" required></label>
          <button type="submit" class="xl go">Send link</button>
        </form>
        <button type="button" id="backIn1" class="small">Back</button>
      </div>

      <div data-pane="reset" class="hidden">
        <h3>Reset password</h3>
        <form id="formReset" class="col">
          <label>Email<input id="resetEmail" type="email" autocomplete="username" required></label>
          <button type="submit" class="xl go">Send reset email</button>
        </form>
        <button type="button" id="backIn2" class="small">Back</button>
      </div>

      <div data-pane="newpin" class="hidden">
        <h3>Choose a new password</h3>
        <form id="formNewPin" class="col">
          <input id="newPinEmail" type="email" autocomplete="username" class="hidden">
          <label>New password<span class="pwfield"><input id="newPin" type="password" autocomplete="new-password" required minlength="6"><button type="button" class="pwshow" data-pw="newPin" aria-pressed="false" aria-label="Show password">Show</button></span></label>
          <button type="submit" class="xl go">Save</button>
        </form>
        <button type="button" id="backIn3" class="small">Back</button>
      </div>

      <div data-pane="home" class="hidden" id="acctSigned">
        <p id="acctDemoTag" class="muted small hidden">Local demo account — stored only in this browser.</p>
        <div class="row acctwhorow">
          <div class="grow acctwho">
            <p id="acctWho"></p>
            <p class="muted small"><span id="acctEmail" class="hidden"></span> <button type="button" id="btnShowEmail" class="small quiet" aria-controls="acctEmail" aria-expanded="false">Show email</button></p>
          </div>
          <button type="button" id="btnSignOut">Sign out</button>
        </div>
        <div class="col">
          <label>Display name<input id="acctName" type="text" maxlength="80"></label>
          <button type="button" id="btnAcctSave">Save name</button>
        </div>
        <h3>Linked machines</h3>
        <div id="acctMachines"></div>
        <div class="row">
          <button type="button" id="btnOpenClaim">Link a machine</button>
          <button type="button" id="acctAdminBtn" class="hidden">Admin</button>
          <button type="button" id="acctDemoAdmin" class="hidden">Demo: make me admin</button>
        </div>
        <h3>Saved parts</h3>
        <button type="button" id="btnAcctParts">Open your saved parts</button>
      </div>
    </div>
  </div>
</div>

<!-- claim a machine -->
<div id="claimDlg" class="acctdlg shapelib hidden" role="dialog" aria-modal="true" aria-labelledby="claimTitle">
  <div class="shapelib-card slim acctcard">
    <div class="shapelib-head">
      <h2 id="claimTitle">Link your machine</h2>
      <button type="button" class="acct-close">Close</button>
    </div>
    <p id="claimHint" class="muted">Enter the one-off claim code from the sticker on the table.</p>
    <form id="formClaim" class="col">
      <label>Claim code<input id="claimCode" type="text" autocomplete="off" autocapitalize="characters" required placeholder="e.g. AB12-CD34"></label>
      <label>Serial (optional — leave blank if you are not sure)<input id="claimSerial" type="text" autocomplete="off" autocapitalize="characters" placeholder="Optional. Leave blank unless you are sure it matches."></label>
      <p id="claimError" class="claim-err hidden" role="alert"></p>
      <button type="submit" class="xl go">Link machine</button>
    </form>
  </div>
</div>
</template>
<template data-slot="account-more">
<!-- sign-in gate (shown when a signed-out user opens something locked) -->
<div id="gateDlg" class="acctdlg shapelib hidden" role="dialog" aria-modal="true" aria-labelledby="gateTitle">
  <div class="shapelib-card slim acctcard">
    <div class="shapelib-head">
      <h2 id="gateTitle">Machine needed</h2>
      <button type="button" class="acct-close">Close</button>
    </div>
    <p id="gateWhy">Locked: sign in, then link a machine to run jobs.</p>
    <div id="lockExplain" class="lockexplain">
      <p><b>Why some buttons are locked</b></p>
      <ul class="plain">
        <li><b>Design, save and download G-code</b> are free. You do not need a machine for those.</li>
        <li><b>Connect, jog, Send and Start cutting</b> stay locked until you sign in and link a purchased table with the claim code on its sticker.</li>
        <li><b>Practice (no machine)</b> lets you watch the motions with the torch off, without a real table.</li>
        <li>A demo account never unlocks a real machine, even with a claim code.</li>
      </ul>
    </div>
    <div class="row">
      <button type="button" id="gateSignIn" class="xl">Sign in</button>
      <button type="button" id="gateClaim" class="xl go">Link a machine</button>
    </div>
  </div>
</div>

<!-- move local parts into the account -->
<div id="migrateDlg" class="acctdlg shapelib hidden" role="dialog" aria-modal="true" aria-labelledby="migrateTitle">
  <div class="shapelib-card slim acctcard">
    <div class="shapelib-head">
      <h2 id="migrateTitle">Keep this drawing?</h2>
    </div>
    <p>There's a drawing on this device from before you signed in. Keep it and save it to your account, or start with an empty page?</p>
    <div class="row">
      <button type="button" id="migrateYes" class="xl go">Keep it, save to my account</button>
      <button type="button" id="migrateNo" class="xl">Start fresh</button>
      <button type="button" id="migrateLater" class="xl">Later</button>
    </div>
  </div>
</div>

<!-- save parts -->
<div id="saveDlg" class="acctdlg shapelib hidden" role="dialog" aria-modal="true" aria-labelledby="saveTitle">
  <div class="shapelib-card slim acctcard">
    <div class="shapelib-head">
      <h2 id="saveTitle">Save this part</h2>
      <button type="button" class="acct-close">Close</button>
    </div>
    <label>Name <input id="saveName" maxlength="120" autocomplete="off"></label>
    <p id="saveText" class="muted small"></p>
    <div class="col">
      <button type="button" id="saveOver" class="xl go">Save over the original</button>
      <button type="button" id="saveCopy" class="xl">Save as copy</button>
    </div>
  </div>
</div>
<!-- undo-save notice -->
<div id="makeCheckDlg" class="acctdlg shapelib hidden" hidden role="dialog" aria-modal="true" aria-labelledby="makeCheckTitle">
  <div class="shapelib-card slim acctcard">
    <h2 id="makeCheckTitle">Check cut</h2>
    <p id="makeCheckAsk" class="muted">Choose the material and thickness, then we'll check this drawing.</p>
    <p id="makeCheckJob" class="makecheck-job" hidden><span id="makeCheckJobText"></span> <button type="button" id="makeCheckChange" class="small">Change</button></p>
    <div id="makeCheckPick" class="makecheck-pick">
      <div class="makecheck-field">
        <span class="makecheck-lab" id="makeCheckMatLab">Material</span>
        <div id="makeCheckMat" class="chips makecheck-chips" role="listbox" aria-labelledby="makeCheckMatLab"></div>
      </div>
      <div class="makecheck-field">
        <span class="makecheck-lab" id="makeCheckThLab">Thickness</span>
        <div id="makeCheckTh" class="chips makecheck-chips" role="listbox" aria-labelledby="makeCheckThLab"></div>
      </div>
      <button type="button" id="makeCheckGo" class="xl go">Check this drawing</button>
    </div>
    <div id="makeCheckOut" class="cutcheck"></div>
    <div class="row"><button type="button" id="makeCheckClose" class="xl">Close</button></div>
  </div>
</div>
<div id="undoSave" class="undosave hidden" role="status"><span id="undoText"></span> <button type="button" id="btnUndoSave" class="small">Undo</button> <button type="button" id="btnUndoX" class="small" aria-label="Dismiss">✕</button></div>

<!-- save conflict -->
<div id="conflictDlg" class="acctdlg shapelib hidden" role="dialog" aria-modal="true" aria-labelledby="conflictTitle">
  <div class="shapelib-card slim acctcard">
    <div class="shapelib-head">
      <h2 id="conflictTitle">This part changed in two places</h2>
      <button type="button" class="acct-close">Close</button>
    </div>
    <p id="conflictText">The copy in your account is newer than the one on this device.</p>
    <div class="col">
      <button type="button" id="conflictMine" class="xl go">Keep mine (last write wins)</button>
      <button type="button" id="conflictBoth" class="xl">Keep both</button>
      <button type="button" id="conflictTheirs" class="xl">Open the other copy</button>
    </div>
  </div>
</div>

<!-- admin console -->
<div id="adminDlg" class="acctdlg shapelib hidden" role="dialog" aria-modal="true" aria-labelledby="adminTitle">
  <div class="shapelib-card acctcard wide">
    <div class="shapelib-head">
      <h2 id="adminTitle">Admin</h2>
      <button type="button" class="acct-close">Close</button>
    </div>
    <p id="adminGating" class="muted small" role="status"></p>
    <div class="admtabs" role="tablist">
      <button type="button" class="admtab sel" data-admtab="users">Users</button>
      <button type="button" class="admtab" data-admtab="stats">Usage</button>
      <button type="button" class="admtab" data-admtab="announce">Announcements</button>
      <button type="button" class="admtab" data-admtab="machines">Machines</button>
      <button type="button" class="admtab" data-admtab="advanced">Advanced machine</button>
      <button type="button" class="admtab" data-admtab="presets">Cut presets</button>
    </div>

    <div class="admpane" data-admpane="users">
      <label class="grow">Search users
        <input id="adminUserQ" type="search" placeholder="Email, name, or serial" autocomplete="off">
      </label>
      <div id="adminUsers"></div>
    </div>

    <div class="admpane hidden" data-admpane="stats">
      <div id="adminStats"></div>
      <h3>Recent jobs</h3>
      <div id="adminJobEvents"></div>
    </div>

    <div class="admpane hidden" data-admpane="announce">
      <form id="formAnnounce" class="col">
        <label>Title<input id="annTitle" required maxlength="200" autocomplete="off"></label>
        <label>Message<textarea id="annBody" required maxlength="4000" rows="4"></textarea></label>
        <div class="grid2">
          <label>Severity
            <select id="annSev">
              <option value="info">Info</option>
              <option value="warning">Warning</option>
              <option value="update">Update</option>
            </select>
          </label>
          <label>Expires (optional)<input id="annExp" type="datetime-local"></label>
        </div>
        <button type="submit" class="go">Publish announcement</button>
      </form>
      <h3>Published</h3>
      <div id="adminAnnList"></div>
    </div>

    <div class="admpane hidden" data-admpane="machines">
      <p class="muted small">Add a serial and a one-off claim code for each table. After you save, the exact code stays on this page so you can copy it. Saving the same serial again replaces the code — you will be asked to confirm. Codes are stored as a hash, not as plain text.</p>
      <form id="formAddMachine" class="col">
        <div class="grid2">
          <label>Serial<input id="admSerial" required autocomplete="off" autocapitalize="characters"></label>
          <label>Claim code
            <span class="row" style="margin-top:0">
              <input id="admCode" class="grow" required autocomplete="off" minlength="8">
              <button type="button" id="btnGenCode" class="small">Generate</button>
            </span>
          </label>
        </div>
        <label>Notes<input id="admNotes" maxlength="200"></label>
        <button type="submit" class="go">Add / update machine</button>
      </form>
      <div id="admSaveReceipt" class="adm-receipt hidden" role="status">
        <p id="admSaveReceiptText"></p>
        <div class="row">
          <button type="button" id="admSaveCopy" class="small">Copy code</button>
          <button type="button" id="admSaveDismiss" class="small">Dismiss</button>
        </div>
      </div>
      <h3>Serials</h3>
      <div id="adminTable"></div>
      <h3>Recent claim attempts</h3>
      <div id="adminLog"></div>
    </div>

    <div class="admpane hidden" data-admpane="advanced">
      <div id="advMachine"></div>
    </div>

    <div class="admpane hidden" data-admpane="presets">
      <p class="muted small">These become the default pierce and cut values for every user. They can still pick their own speed on a job.</p>
      <form id="formPreset" class="col">
        <div class="grid2">
          <label>Material<input id="preMat" required autocomplete="off" placeholder="Mild steel"></label>
          <label>Thickness (mm)<input id="preThk" required type="number" min="0.1" step="0.1" inputmode="decimal"></label>
        </div>
        <div class="grid3">
          <label>Pierce delay (s)<input id="preDelay" type="number" min="0" step="0.05" inputmode="decimal"></label>
          <label>Pierce height (mm)<input id="preHeight" type="number" min="0" step="0.1" inputmode="decimal"></label>
          <label>Cut speed (mm/min)<input id="preSpeed" type="number" min="0" step="10" inputmode="decimal"></label>
        </div>
        <label>Notes<input id="preNotes" maxlength="200"></label>
        <button type="submit" class="go">Save preset</button>
      </form>
      <div id="adminPresets"></div>
    </div>
  </div>
</div>

<!-- admin: write an announcement -->
<div id="announceDlg" class="acctdlg shapelib hidden" role="dialog" aria-modal="true" aria-labelledby="announceDlgTitle">
  <div class="shapelib-card slim acctcard">
    <div class="shapelib-head">
      <h2 id="announceDlgTitle">Announcements</h2>
      <button type="button" class="acct-close">Close</button>
    </div>
    <div id="announceInbox"></div>
  </div>
</div>
</template>
