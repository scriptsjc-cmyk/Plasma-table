<!-- Go to cutting: the step bar and the Part / Bed & start / Cut panes. Loaded into the shell at start-up. -->
<template data-slot="cut-stepper">
<ol class="stepper" id="stepper">
    <li data-step="1"><span>1</span>Part</li>
    <li data-step="3"><span>2</span>Bed &amp; start</li>
    <li data-step="4"><span>3</span>Cut</li>
  </ol>
</template>
<template data-slot="cut-step1">
        <!-- CUTTING SCREEN: choose what to cut -->
        <div id="pickPane" class="pickpane">
          <h3>Choose the part</h3>
          <p id="bedStatus" class="bedstatus hidden"><span id="bedStatusText"></span> <button type="button" id="btnClearBed" class="small">Start over</button></p>
          <label id="drop" class="drop drop-slim">
            <input type="file" id="file" multiple accept=".dxf,.svg,.nc,.gcode,.ngc,.tap,.txt,.cnc,.g">
            <b id="dropTitle">Upload a file</b>
            <span class="drop-detail">
              <span class="muted">or drag it here · several DXF or SVG files at once is fine</span>
              <span class="muted small">DXF or SVG from your CAD · or ready-made G-code (.nc .gcode .tap)</span>
            </span>
          </label>
          <div class="row wrap pickrow">
            <button type="button" id="btnPickSaved" class="xl">📁 Saved parts &amp; folders</button>
            <button type="button" id="btnCoupon" class="xl" title="Cut a small test part (60 × 40 mm with a hole) in the material and thickness chosen below, then record how it came out">🧪 Cut-test coupon</button>
            <button type="button" id="btnStraight" class="xl" title="Cut a straight line (sheet trim) with no drawing">➖ Straight cut</button>
            <button type="button" id="btnEditDrawing" class="xl hidden" title="Open this drawing in Make a part to change lengths, square corners, curve edges, add holes">✏ Edit in Make a part</button>
          </div>
          <div id="recentWrap" class="hidden">
            <h3>Recent</h3>
            <div id="recent" class="chips"></div>
          </div>
          <h3>Material and thickness</h3>
          <p id="matLine" class="matline"></p>
          <div class="s2cols">
            <div class="s2a">
              <label class="matpreset-wrap">Preset
                <select id="matPreset" aria-label="Material preset"></select>
              </label>
              <div id="materials" class="choice"></div>
              <h3>Thickness</h3>
              <div id="thicknesses" class="choice small"></div>
              <p id="matTip" class="mattip"></p>
              <div id="ampsCard" class="amps"></div>
              <label class="check prominent"><input type="checkbox" id="dryRun"> Practice run – move only, torch stays off</label>
              <p id="dryFirstNote" class="muted small hidden">Ticked for you because this is your first job: the table moves but the torch stays off. Untick it when you want to cut for real.</p>
            </div>
            <div class="s2b">
              <div id="cutCheck2" class="cutcheck"></div>
            </div>
          </div>
          <details class="adjust" id="advCut">
            <summary>More cut options</summary>
            <div class="speed">
              <div class="speedhead"><b>Cut speed</b><button id="spReset" class="small">Use recommended</button></div>
              <div class="speedrow">
                <button id="spDown" class="xl" aria-label="Slower">−</button>
                <div class="speedval"><b id="spVal">0</b><span>mm/min</span></div>
                <button id="spUp" class="xl" aria-label="Faster">+</button>
              </div>
              <input type="range" id="spSlider" aria-label="Cut speed">
              <div><span>slower</span><span id="spRange"></span><span>faster</span></div>
              <p id="spNote" class="spnote"></p>
            </div>
            <p class="muted small">Leave a box empty to use the recommended value shown in it as “Auto”.</p>
            <div class="grid2">
              <label>Cut width / kerf (mm)<input id="ovKerf" type="number" step="0.1" inputmode="decimal"></label>
              <label>Lead-in (mm)<input id="ovLead" type="number" step="0.5" inputmode="decimal"></label>
              <label>Pierce delay (s)<input id="ovDelay" type="number" step="0.1" inputmode="decimal"></label>
              <label>Pierce height (mm)<input id="ovPierce" type="number" step="0.1" inputmode="decimal"></label>
              <label>Cut height (mm)<input id="ovCut" type="number" step="0.1" inputmode="decimal"></label>
            </div>
            <div id="camPanel" class="campanel">
              <h3>Tabs, run-out and start points</h3>
              <div class="grid2">
                <label>Hold-down tabs per part<input id="camTabs" type="number" min="0" max="12" step="1" value="0" inputmode="numeric"></label>
                <label>Tab width (mm)<input id="camTabW" type="number" min="1" max="30" step="0.5" value="3" inputmode="decimal"></label>
                <label>Lead-out (mm)<input id="camOut" type="number" min="0" max="30" step="0.5" value="0" inputmode="decimal"></label>
                <label>Overcut (mm)<input id="camOver" type="number" min="0" max="30" step="0.5" value="0" inputmode="decimal"></label>
              </div>
              <p class="muted small">Drag the green start dot or the orange tab dots on the picture to move them.</p>
              <div class="row wrap"><button type="button" id="camReset" class="small">Reset starts and tabs</button></div>
            </div>
            <div id="cutListCard" class="cutlistcard hidden">
              <h3>Cut order <span class="muted small">drag the handle or the arrows to reorder · untick to skip</span></h3>
              <ol id="cutList" class="cutlist"></ol>
              <div class="row wrap"><button type="button" id="cutAuto" class="small">Back to automatic order</button></div>
            </div>
          </details>
        </div>
</template>
<template data-slot="cut-steps">
      <!-- step 3: Get set up = lay the parts out on the sheet + work zero + final checks -->
      <div class="step hidden" data-step="3">
        <h2>Place the parts, then get set up</h2>
        <div id="cutCheck3" class="cutcheck"></div>
        <details class="setupcard" id="layoutCard" open>
          <summary><b>Parts on the bed</b> <span id="layoutState" class="layoutstate"></span></summary>
          <div class="sheetrow">
            <label>Sheet width <span class="unitin"><input id="sheetW" type="number" min="50" step="any" inputmode="decimal"> <span class="unit">mm</span></span></label>
            <label>Height <span class="unitin"><input id="sheetH" type="number" min="50" step="any" inputmode="decimal"> <span class="unit">mm</span></span></label>
            <label>Clearance <span class="unitin"><input id="sheetClr" type="number" min="0" step="0.5" inputmode="decimal" value="2"> <span class="unit">mm</span></span></label>
          </div>
          <p class="muted small" id="sheetNote"></p>
          <div class="skbtns bigbtns laybtns">
            <button type="button" id="layAdd" class="accent">＋ Add parts…</button>
            <button type="button" id="layAuto" title="Pack every part onto the sheet with the right gaps">⊞ Arrange for me</button>
            <button type="button" id="btnEditParts" title="Shapes and sizes are changed in Make a part (the picked part is opened there), then you come back here">✏ Edit in Make a part</button>
          </div>
          <details class="nestbox" id="nestBox">
            <summary><b>Nest to fit</b> <span class="muted small">pack by outline, use the holes, save the leftover</span></summary>
            <div class="row wrap">
              <label>Turn parts <select id="nestTurn"><option value="0">Don't turn them</option><option value="90" selected>Quarter turns</option><option value="45">45° steps</option><option value="15">15° steps</option><option value="5">5° steps (slower)</option></select></label>
              <label class="check"><input type="checkbox" id="nestHoles" checked> Put small parts inside the holes of bigger ones</label>
            </div>
            <div class="row wrap"><button type="button" id="nestGo" class="accent">▦ Nest to fit</button><button type="button" id="nestStop" class="hidden">Stop</button></div>
            <p class="muted small" id="nestInfo" role="status">Packs the parts by their real outline, keeping the cut-check gap between them. Locked parts stay where they are.</p>
            <h4 class="nesth">Leftover sheet</h4>
            <p class="muted small" id="remInfo"></p>
            <div class="row wrap">
              <button type="button" id="remSave">Save the leftover as a remnant</button>
              <label class="grow">Lay out on <select id="remPick"></select></label>
              <button type="button" id="remDel" class="small danger" title="Delete the picked saved remnant">Delete</button>
            </div>
          </details>
          <p class="muted small beginner-help">Drag a part to move it. Blue lines show when it lines up; numbers show the gap. Red means too close, overlapping, or off the sheet.</p>
          <div id="layoutSel" class="layoutsel hidden">
            <div class="selhead"><b id="laySelName">Part</b></div>
            <div class="skbtns laytools">
              <button type="button" data-lay="rot90" title="Turn 90° (R)">⟳ 90°</button>
              <button type="button" data-lay="rotm90" title="Turn back 90° (Shift+R)">⟲ 90°</button>
              <button type="button" data-lay="dup" title="Copy (Ctrl+D)">⧉ Copy</button>
              <button type="button" data-lay="del" class="danger" title="Delete">🗑 Delete</button>
            </div>
            <div class="row layangle">
              <label class="grow">Angle ° <input id="layAngle" type="number" step="any" inputmode="decimal" aria-label="Free angle in degrees"></label>
              <button type="button" id="layAngleSet" class="small">Turn to this</button>
            </div>
            <div class="row layfine">
              <label>Nudge <select id="layNudge"><option value="0.5">0.5 mm</option><option value="1" selected>1 mm</option><option value="5">5 mm</option><option value="10">10 mm</option></select></label>
              <button type="button" data-nudge="-1,0" aria-label="Nudge left">←</button><button type="button" data-nudge="0,1" aria-label="Nudge up">↑</button><button type="button" data-nudge="0,-1" aria-label="Nudge down">↓</button><button type="button" data-nudge="1,0" aria-label="Nudge right">→</button>
              <span class="muted small">or the arrow keys</span>
            </div>
          </div>
          <div class="row laygrid">
            <label>Grid snap <select id="layGrid"><option value="0">off</option><option value="1">1 mm</option><option value="5">5 mm</option><option value="10">10 mm</option><option value="25">25 mm</option></select></label>
            <button type="button" id="layFit" class="small">⤢ Whole sheet</button> <button type="button" id="layZoom" class="small">🔍 Zoom to parts</button>
          </div>
          <ul id="layProblems" class="layproblems"></ul>
        </details>

        <details class="setupcard" id="zeroCard" open>
          <summary><b>Connect the table</b> <span id="zeroState" class="layoutstate muted small">The part cuts where you place it.</span></summary>
          <div class="zerobody">
          <div class="zeroscroll">
            <p class="muted small" id="bedStartHelp">The part cuts where you place it on the bed. You do not set a start point on the part. <b>Start here</b> only tells the table where the sheet's bottom-left corner is (that corner is 0, 0 on the layout; every cut is measured from there). The torch does not move. <b>Go to start point</b> then goes to where the cut begins.</p>
            <div id="connectCard" class="connectcard">
              <div class="row wrap">
                <button id="btnConnect" class="xl go">Connect with USB</button>
                <button id="btnDemo" class="xl">Practice (no machine)</button>
                <button type="button" id="btnDisconnect" class="xl hidden">Disconnect</button>
              </div>
              <div id="connectLock" class="lockcard hidden">
                <p id="connectLockText" class="locknote">Or, to cut for real:</p>
                <button type="button" id="btnLinkMachine" class="xl go">Link a machine</button>
              </div>
              <details id="fnBox" class="fnbox">
                <summary>FluidNC (Wi-Fi)</summary>
                <p class="muted small">ESP32 running FluidNC on the same Wi-Fi. Default socket is <code>ws://&lt;ip&gt;:81</code>.</p>
                <div class="grid2">
                  <label>IP or hostname<input id="fnHost" type="text" placeholder="192.168.1.50 or fluidnc.local" autocomplete="off" autocorrect="off" spellcheck="false"></label>
                  <label>WebSocket port<input id="fnPort" type="number" value="81" min="1" max="65535" inputmode="numeric"></label>
                </div>
                <button type="button" id="btnFluidNC" class="xl">Connect to FluidNC</button>
                <p id="fnMixed" class="warntext hidden"></p>
                <button type="button" id="btnWifiSetup">Put the table on your Wi-Fi…</button>
              </details>
              <p id="connectHelp" class="muted small">USB works in Chrome or Edge on a computer. Close Mach3 or any other program using the port first. Got the Wi-Fi Pi fitted? Open <b>http://plasma.local</b> instead. FluidNC from the live https site is blocked by the browser — serve a local http copy, or use USB.</p>
            </div>
            <div class="row wrap homerow">
              <button class="do-home">⌂ Home</button>
              <button class="do-raise">⤒ Raise torch</button>
              <button id="btnGoStart">Go to start point</button>
            </div>
            <div class="jogmount"></div>
            <p class="muted small keyhint">Keyboard: arrows move the torch, Page Up / Page Down raise and lower it. Tap for one step, hold to glide; Shift goes slow.</p>
            <details id="originCard" class="originbox">
              <summary>Job origin &amp; saved start points</summary>
              <p class="muted small"><span id="originNow"></span> Pick a different spot to measure from:</p>
              <div id="origin9" class="grid9" role="group" aria-label="Which part of the job goes at the start point"></div>
              <button type="button" id="originDefault" class="small hidden">Back to default</button>
              <div class="row wrap woform"><input id="woName" type="text" maxlength="40" placeholder="Name this start point (e.g. left clamp)" aria-label="Name for the saved start point" autocomplete="off"><button type="button" id="woSave" class="small">Save the current start point</button></div>
              <p id="woNeed" class="muted small">Connect and Home to use saved start points.</p>
              <ul id="woList" class="wolist"></ul>
            </details>
            <p id="originHelp" class="muted small hidden"></p>
          </div>
          <button id="btnZero" class="xl accent wide">📍 Start here</button>
          <button id="btnTrace" class="wide" title="Walk the outline with the torch off, to check the part is on the sheet">Trace the outline (torch off)</button>
          </div>
        </details>

        <details class="setupcard" id="checkCard" open>
          <summary><b>Check, then cut</b></summary>
          <p class="checkmat"><span id="checkMat"></span> <button type="button" id="btnChangeMat" class="small" aria-label="Change material or part" title="Change material or part">Change</button></p>
          <ul class="checklist" id="checklist"></ul>
          <p id="zeroWarn" class="warntext hidden">Press Start here at the sheet corner. The part already cuts where you placed it.</p>
        <div id="startCutRow" class="startcut hidden">
          <label>Start from cut
            <select id="startCut" aria-label="Start from cut number"></select>
          </label>
          <p id="resumeWhy" class="warntext small hidden" role="status"></p>
          <p class="muted small" id="startCutNote">Cuts before this one are skipped. The torch rapids there with the arc off and pierces fresh at that cut's start.</p>
        </div>
          <div id="blockers" class="blockers"></div>
        </details>
        <div class="nav"><button class="back" data-go="1">← Back</button><button id="btnStart" class="xl go" disabled aria-describedby="startWhy">▶ Start cutting</button><button type="button" id="btnExport3" class="xl" title="Save the G-code for this layout as a file">⬇ Download G-code</button><button type="button" id="btnMore3" class="cutmore-btn" aria-haspopup="dialog" aria-controls="cutSheet" aria-expanded="false"><svg class="ico" aria-hidden="true" viewBox="0 0 24 24"><use href="#i-more"></use></svg><span>More</span></button><p id="startWhy" class="startwhy hidden" role="status"></p></div>
      </div>

      <!-- step 4: running / done -->
      <div class="step hidden" data-step="4">
        <div id="lostArc" class="lostarc hidden" role="alert">
          <p><b id="lostArcHead">Arc lost.</b> <span id="lostArcText"></span></p>
          <button type="button" id="btnLostResume" class="xl accent">Continue from cut 1…</button>
        </div>
        <div id="running">
          <h2 id="runTitle">Cutting…</h2>
          <div class="runnums">
            <div><div class="bigpct" id="pct">0%</div><span>done</span></div>
            <div><div class="bigleft" id="timeLeft">–</div><span>left</span></div>
          </div>
          <div class="progress"><div id="progBar"></div></div>
          <p class="muted" id="runInfo"></p>
          <div class="pos small-pos runpos" role="group" aria-label="Torch position from the start point (mm)"></div>
          <div id="livePanel" class="livepanel" role="group" aria-label="Live torch and arc readings">
            <div class="lp" id="lpArc"><span>Arc OK</span><b>not connected</b></div>
            <div class="lp" id="lpVolts"><span>Arc volts</span><b>not connected</b></div>
            <div class="lp" id="lpZ"><span>Torch height</span><b>not connected</b></div>
            <div class="lp" id="lpPierce"><span>Pierces</span><b>0 this job · 0 total</b></div>
          </div>
          <p id="lpNote" class="muted small lpnote"></p>
          <div class="torchbig" id="torchBig">TORCH OFF</div>
          <div id="liveSpeedBox" class="livespeed">
            <div>Speed <b id="liveSpeed">–</b></div>
            <div class="row">
              <button id="lsDown" class="xl grow">− Slower</button>
              <button id="lsUp" class="xl grow">+ Faster</button>
            </div>
            <p class="muted small">Sparks spraying up out of the top = too fast. Dripping straight down = too slow.</p>
            <div id="delayRow" class="delayrow">
              <div>Pierce delay <b id="liveDelay">–</b></div>
              <div class="row">
                <button type="button" id="delDown" class="grow" aria-label="− 0.1 s, pierce delay shorter">− 0.1 s</button>
                <button type="button" id="delUp" class="grow" aria-label="+ 0.1 s, pierce delay longer">+ 0.1 s</button>
                <button type="button" id="delSave" class="grow small">Save to cut chart</button>
              </div>
              <p class="muted small" id="delNote">Applies from the next pierce that hasn't started yet.</p>
            </div>
          </div>
          <div class="row runctl">
            <button id="btnPause" class="xl">⏸ Pause</button>
            <button type="button" id="btnMore4" class="cutmore-btn" aria-haspopup="dialog" aria-controls="cutSheet" aria-expanded="false"><svg class="ico" aria-hidden="true" viewBox="0 0 24 24"><use href="#i-more"></use></svg><span>More</span></button>
          </div>
          <p id="runHelp" class="muted small">Pause stops the machine and the torch. E-STOP or the space bar cancels the job. Keep this tab open and the computer awake.</p>
        </div>
        <div id="done" class="hidden">
          <h2 id="doneTitle">Finished ✓</h2>
          <p id="doneInfo" class="muted"></p>
          <button id="btnSaveSpeed" class="wide accent hidden"></button>
          <button type="button" id="btnExport4" class="wide">⬇ Download G-code</button>
          <div id="couponResult" class="couponresult hidden" role="group" aria-labelledby="cpHead">
            <p><b id="cpHead">How did the test coupon cut?</b></p>
            <div class="resbtns"></div>
            <div class="row wrap">
              <label>Speed to use (mm/min, optional)<input id="cpSpeed" type="number" inputmode="decimal" min="10" max="20000" step="10"></label>
              <label>Amps (optional)<input id="cpAmps" type="number" inputmode="decimal" min="5" max="500" step="1"></label>
            </div>
            <div class="row"><button type="button" id="cpSave" class="xl accent grow" disabled>Save to the cut chart</button><button type="button" id="cpSkip" class="grow">Not now</button></div>
          </div>
          <div id="restartBox" class="restartbox hidden">
            <p><b id="restartHead">Stopped during cut 1.</b> <span class="muted">After a stop the machine may have lost its position, so you will Home it and set the start point again on Bed &amp; start before the torch can fire. The torch stays off until it is over the start of the cut.</span></p>
            <div class="row">
              <label class="grow">Continue from cut <select id="restartCut" aria-label="Continue from cut number"></select></label>
              <button type="button" id="btnRestart" class="xl accent grow">Continue from cut 1</button>
            </div>
          </div>
          <div class="col">
            <button id="btnAgain" class="xl go">Cut another one</button>
            <button id="btnRezero" class="xl accent hidden">Set a new start point first</button>
            <button id="btnNewFile" class="xl">Cut a different part</button>
          </div>
        </div>
      </div>
</template>
