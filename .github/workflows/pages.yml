# Deploys the site to GitHub Pages and stamps the release id from the commit being deployed,
# so the live version.json / footer / service-worker cache always equal the deployed commit
# (no separate "Stamp version" commit, which used to leave the live version one commit behind).
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # r13 section 5: deploy only after the gate passes. tests/ci-gate.mjs runs every unit suite plus the safety and fit
  # end-to-end suites (20_demo_job_safety, 22_stop_overlay, 70, 74, 92_r9_chrome, 96_fits_screen, 110, 111, 112, 113_r15_fits, 120_every_tool, 121_features, 122_loose_holes); only the checks listed in
  # tests/known-failures.txt may fail. Everything runs against a local static server and the in-browser practice table.
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: tests/package-lock.json
      - name: Install test tools
        working-directory: tests
        run: npm ci
      - name: Check Chrome is there (Playwright uses the installed Google Chrome)
        run: google-chrome --version
      - name: Deploy gate
        working-directory: tests
        env:
          JOBS: "2"
        run: node ci-gate.mjs

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out the commit being deployed
        uses: actions/checkout@v4
      - name: Stamp version
        run: ./scripts/stamp-version.sh
      - name: Show what was stamped
        run: cat version.json
      - name: Tighten the public page's CSP (no WebSockets on the https site)
        run: ./scripts/harden-csp.sh
      - uses: actions/configure-pages@v5
      - name: Upload the site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
