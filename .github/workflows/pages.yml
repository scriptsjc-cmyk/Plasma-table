# Deploys the site to GitHub Pages and stamps the release id from the commit being deployed,
# so the live version.json / footer / service-worker cache always equal the deployed commit
# (no separate "Stamp version" commit, which used to leave the live version one commit behind).
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out the commit being deployed
        uses: actions/checkout@v4
      - name: Stamp version
        run: ./scripts/stamp-version.sh
      - name: Show what was stamped
        run: cat version.json
      - name: Tighten the public page's CSP (no WebSockets on the https site)
        run: ./scripts/harden-csp.sh
      - uses: actions/configure-pages@v5
      - name: Upload the site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
