<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Porta Plazma">
  <!-- Square app icon: a bold P cut through by a plasma kerf, with an ember at the tip.
       Thick strokes so it still reads at 16px. Colours: navy #0B1F33, off-white #F4F7FA,
       plasma cyan #00B4D8, ember #FF7A1A. -->
  <rect width="32" height="32" rx="8" fill="#0B1F33"/>
  <!-- Upper half of the P (above the kerf) -->
  <path fill="#F4F7FA" d="M8 6.2h9.1c3.55 0 5.85 2.05 5.85 5.05 0 2.95-2.3 5.05-5.85 5.05H8V6.2zm4.15 3.15v3.8h4.85c1.45 0 2.35-.75 2.35-1.9s-.9-1.9-2.35-1.9H12.15z"/>
  <!-- Lower stem of the P (below the kerf) -->
  <path fill="#F4F7FA" d="M8 17.55h4.15V25.8H8z"/>
  <!-- Plasma kerf: cyan body, white-hot core, ember tip on the right -->
  <path d="M5 16h19.2" stroke="#00B4D8" stroke-width="2.15" stroke-linecap="butt"/>
  <path d="M5 16h18.4" stroke="#F4F7FA" stroke-width="0.7" stroke-linecap="butt"/>
  <circle cx="25.1" cy="16" r="1.85" fill="#FF7A1A"/>
  <circle cx="25.1" cy="16" r="0.7" fill="#FFF3C4"/>
</svg>
